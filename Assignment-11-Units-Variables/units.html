<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Units</title>
  <style>
    .pixel-box { width: 200px; height: 40px; background: lightblue; margin-bottom: 12px; }
    .percent-box { width: 50%; height: 40px; background: lightgreen; margin-bottom: 12px; }
    .large-text { font-size: 1.5rem; }
  </style>
</head>
<body>
<div class="pixel-box">200px wide box</div>
<div class="percent-box">50% wide box</div>
<p class="large-text">This paragraph uses a font size of 1.5rem.</p>
</body>
</html>
