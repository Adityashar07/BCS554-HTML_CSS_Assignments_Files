<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Marks Table</title>
  <style>
    table { border-collapse: collapse; }
    th, td { padding: 8px 14px; text-align: left; }
    caption { font-weight: bold; padding: 8px; }
  </style>
</head>
<body>
<table border="1">
  <caption>Marks of Class A</caption>
  <thead>
    <tr><th scope="col">Name</th><th scope="col">Maths</th><th scope="col">Science</th></tr>
  </thead>
  <tbody>
    <tr><th scope="row">Asha</th><td>78</td><td>85</td></tr>
    <tr><th scope="row">Rohan</th><td>64</td><td>70</td></tr>
  </tbody>
</table>
</body>
</html>
