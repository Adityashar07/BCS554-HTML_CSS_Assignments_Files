<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing</title>
  <style>
    .box { width: 200px; padding: 20px; border: 5px solid navy; margin: 16px 0; background: #eaf2ff; }
    .content-box { box-sizing: content-box; width: 200px; padding: 20px; border: 5px solid navy; margin: 16px 0; background: #eaf2ff; }
    .border-box { box-sizing: border-box; width: 200px; padding: 20px; border: 5px solid darkgreen; margin: 16px 0; background: #e8f5e9; }
  </style>
</head>
<body>
<div class="content-box">content-box: width 200px + padding + border</div>
<div class="border-box">border-box: total width 200px</div>
</body>
</html>
