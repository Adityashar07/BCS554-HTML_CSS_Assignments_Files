<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centred Cards</title>
  <style>
    .row { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 80vh; flex-wrap: wrap; }
    .card { width: 180px; padding: 20px; text-align: center; background: #eaf2ff; border: 1px solid #1d3557; border-radius: 8px; }
  </style>
</head>
<body>
<div class="row">
  <div class="card"><h3>Starter</h3><p>Price: 199</p></div>
  <div class="card"><h3>Standard</h3><p>Price: 349</p></div>
  <div class="card"><h3>Premium</h3><p>Price: 499</p></div>
</div>
</body>
</html>
